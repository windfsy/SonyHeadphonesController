name: Release

on:
  push:
    # 两种 tag 形式都接受：与历史 release 一致的 `0.1.2`，以及带 v 前缀的 `v0.1.2`
    tags: ['v*', '[0-9]*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 版本一致性：tag 必须与 CHANGELOG 最新版本号一致，防止忘更新 CHANGELOG
      - name: Verify tag matches CHANGELOG
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $changelog = (Select-String -Path CHANGELOG.md -Pattern '^## \[(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\]' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $changelog) {
            Write-Error "tag v$tag 与 CHANGELOG 最新版本 $changelog 不一致，请先更新 CHANGELOG.md"
            exit 1
          }

      - name: Build (warnings as errors)
        run: dotnet build SonyHeadphonesController.sln -c Release -p:TreatWarningsAsErrors=true

      - name: Publish
        run: dotnet publish src/SonyHeadphonesController -c Release -o publish

      # 与手工发布习惯一致：不携带 pdb
      - name: Package zip
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          Compress-Archive -Path publish/* -DestinationPath "SonyHeadphonesController-$ver-win-x64.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $zip = "SonyHeadphonesController-$ver-win-x64.zip"
          gh release create "${env:GITHUB_REF_NAME}" $zip `
            --title "$ver" `
            --generate-notes
