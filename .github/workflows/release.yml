name: Release

on:
  push:
    # 两种 tag 形式都接受：与历史 release 一致的 `0.1.2`，以及带 v 前缀的 `v0.1.2`
    tags: ['v*', '[0-9]*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Actions 按 commit SHA 钉死（仓库已开启 sha_pinning_required）：tag/branch 可被移动，
      # SHA 不能。升级时改 SHA 并同步注释里的版本号，或交给 Dependabot。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # 版本一致性：tag 必须与 CHANGELOG 最新版本号一致，防止忘更新 CHANGELOG
      - name: Verify tag matches CHANGELOG
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $changelog = (Select-String -Path CHANGELOG.md -Pattern '^## \[(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\]' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $changelog) {
            Write-Error "tag v$tag 与 CHANGELOG 最新版本 $changelog 不一致，请先更新 CHANGELOG.md"
            exit 1
          }

      - name: Build (warnings as errors)
        run: dotnet build SonyHeadphonesController.sln -c Release -p:TreatWarningsAsErrors=true

      - name: Publish
        run: dotnet publish src/SonyHeadphonesController -c Release -o publish

      # 与手工发布习惯一致：不携带 pdb
      - name: Package zip
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $zip = "SonyHeadphonesController-$ver-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          # 仓库开启了不可变发布：release 一旦创建就补不了资产，校验值必须与 zip 同批上传
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $zip" | Out-File "$zip.sha256" -Encoding ascii -NoNewline
          Write-Output "sha256=$hash"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $zip = "SonyHeadphonesController-$ver-win-x64.zip"
          # 两个资产在创建时一并提交（gh 内部先建草稿、上传、再发布）
          gh release create "${env:GITHUB_REF_NAME}" $zip "$zip.sha256" `
            --title "$ver" `
            --generate-notes
